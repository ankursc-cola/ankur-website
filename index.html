  <body>
    <div id="root"></div>
    <script type="text/javascript">
  // Decodes the redirect from 404.html back into a clean URL,
  // before React Router mounts and reads the current path.
  (function (l) {
    if (l.search[1] === "/") {
      var decoded = l.search
        .slice(1)
        .split("&")
        .map(function (s) {
          return s.replace(/~and~/g, "&");
        })
        .join("?");
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);
</script>
