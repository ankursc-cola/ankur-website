<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ankur</title>
    <script type="text/javascript">
      // Redirects deep-linked/refreshed URLs back into the SPA so
      // React Router can handle them — GitHub Pages has no server-side
      // routing, so this file only exists to bounce traffic back.
      var pathSegmentsToKeep = 0; // 0 because ankursc.org is a custom root domain
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
